<h1>Get Involved</h1>
<p>Interested in Volunteering your time or supporting TSO as a sponsor? fill out the form below and we'll be in touch</p>
<form action="#" method="post">
    <label for="name">full Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="Email" required>
   
     <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" required>

     <label for="EnquiryType">I am Interested in:</label>
      <select id="EnquiryType" name="EnquiryType" required>
        <option value="">--Select an option--</option>
        <option value="volunteer"> Volunteering</option>
        <option value="sponsor">becoming a sponsor</option>
      </select>
<label for="message">Tell us more:</label>
<textarea id="message" name="message" rows="5"></textarea>
<button type="submit">submit Enquiry</button>
</form>
